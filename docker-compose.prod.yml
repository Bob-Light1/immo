# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTION stack — CampusGest (KingCity).
# Usage:  docker compose -f docker-compose.prod.yml up -d --build
# Variables read from the directory's `.env` file (see .env.production.example).
# Only Caddy (80/443) is exposed publicly; everything else stays private.
# Details: docs/DEPLOIEMENT.md
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: campusgest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusgest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: campusgest
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusgest"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # ── Job queue + SSE relay ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: campusgest-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # ── S3-compatible object storage ───────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: campusgest-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY manquant dans .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY manquant dans .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    # NB: the console (9001) and the API (9000) are NOT published; public access
    # to the objects goes through Caddy (/storage/*).

  # Creates the bucket and opens it for anonymous read (public image/document URLs).
  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    container_name: campusgest-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/${S3_BUCKET:-campusgest} &&
      mc anonymous set download local/${S3_BUCKET:-campusgest} &&
      echo 'bucket prêt (lecture publique)';
      "
    networks: [internal]
    restart: "no"

  # ── Prisma migration (one-shot, idempotent) ────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: packages/workers/Dockerfile
    container_name: campusgest-migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    # Direct binary call: reads DATABASE_URL from the injected environment.
    command: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
    restart: "no"
    networks: [internal]

  # ── Admin seed (one-shot, idempotent) ──────────────────────────────────────
  seed:
    build:
      context: .
      dockerfile: packages/workers/Dockerfile
    container_name: campusgest-seed
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    # seed.ts reads ADMIN_DEFAULT_* from process.env — no dotenv wrapper needed.
    command: npx tsx packages/db/prisma/seed.ts
    restart: "no"
    networks: [internal]

  # ── Web application (Next.js) ──────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_APP_URL is frozen at build time (client bundle) and S3_PUBLIC_URL
        # in the CSP (Next resolves `headers()` at build) → passed as build args.
        # S3_PUBLIC_URL is optional: stored objects are served from this app's own
        # origin under /storage, and only pre-existing absolute URLs still need it.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL manquant dans .env}
        S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    container_name: campusgest-web
    restart: unless-stopped
    env_file: .env
    environment:
      # Month keys (YYYY-MM) are derived from local clock components, and a
      # container's clock is UTC unless told otherwise — the host's time zone
      # does not propagate. Overridable from .env.
      TZ: ${TZ:-Africa/Douala}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]

  # ── Scheduled jobs (due dates, roll-overs, birthdays) ──────────────────────
  workers:
    build:
      context: .
      dockerfile: packages/workers/Dockerfile
    container_name: campusgest-workers
    restart: unless-stopped
    env_file: .env
    environment:
      # The BullMQ cron patterns (07:00, 08:00, 06:00 on the 1st) are read in
      # the container's zone — UTC by default, hence the explicit setting.
      TZ: ${TZ:-Africa/Douala}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  # ── Reverse proxy + automatic TLS (Let's Encrypt) ──────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: campusgest-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Domain and storage target injected into the Caddyfile.
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN manquant dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - minio
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:

networks:
  internal:
    driver: bridge
