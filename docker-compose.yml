services:
  postgres:
    image: postgres:15-alpine
    container_name: campusgest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusgest
      POSTGRES_PASSWORD: campusgest
      POSTGRES_DB: campusgest
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusgest"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: campusgest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stockage objet S3-compatible self-host (images posts/portfolio/projets,
  # documents, justificatifs de paiement — conception §6). Alternative
  # self-host à Cloudinary ; même API S3 → migration future possible.
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: campusgest-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: campusgest
      MINIO_ROOT_PASSWORD: campusgest-secret
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # console web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crée le bucket au démarrage et l'ouvre en lecture anonyme (les URLs
  # d'images/documents sont servies directement par MinIO).
  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    container_name: campusgest-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 campusgest campusgest-secret &&
      mc mb --ignore-existing local/campusgest &&
      mc anonymous set download local/campusgest &&
      echo 'bucket campusgest prêt (lecture publique)';
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
